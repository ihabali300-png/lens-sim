<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محاكي مجالات البروجرسيف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: customer-facing showroom page. Live lens view first, brand and lens picker under the thumb, benefits last. Single dark theme by choice (showroom screen). */
  --bg:#0d1430; --panel:#18214a; --panel2:#222d5e; --line:#33407a;
  --ink:#f1f4fc; --mute:#a4b0d6;
  --accent:#f0c36a; --clear:#7fd8ff;
  --display:'El Messiri','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body.fs{overflow:hidden}
main{max-width:620px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:25px;margin:4px 0 0;line-height:1.3;text-wrap:balance}
h2{font-family:var(--display);font-size:20px;margin:0;color:var(--accent)}
.sub{color:var(--mute);margin:0;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:#231a04;border-color:var(--accent);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 button{display:flex;flex-direction:column;align-items:center;line-height:1.3;padding:8px 2px}
.grid3 small{font-size:11px;opacity:.8}
#wrap{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#000;touch-action:none;cursor:grab}
body.fs #wrap{position:fixed;z-index:999;border-radius:0;aspect-ratio:auto}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#fsbar{display:none;position:absolute;top:8px;left:8px;right:8px;gap:8px;align-items:center;justify-content:center}
body.fs #fsbar{display:flex}
#fsbar button{background:rgba(13,20,48,.78);border-color:rgba(255,255,255,.25);padding:6px 12px}
#fsName{background:var(--accent);color:#231a04;font-weight:700;border-radius:10px;padding:6px 14px;white-space:nowrap}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(13,20,48,.78);border-radius:20px;padding:4px 14px;font-size:13px;pointer-events:none;white-space:nowrap}
.big{width:100%;padding:11px;font-weight:700;font-size:16px;background:var(--accent);color:#231a04;border-color:var(--accent)}
ul.ben{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
ul.ben li{background:var(--panel2);border-radius:10px;padding:7px 10px;display:flex;gap:8px;align-items:baseline}
ul.ben li::before{content:"✓";color:var(--clear);font-weight:700}
.meter{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin-top:10px;font-size:13.5px}
.meter .track{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.meter .fill{height:100%;background:var(--clear);border-radius:5px;transition:width .3s}
select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;flex:1;min-width:0}
details{color:var(--mute);font-size:13.5px}
summary{cursor:pointer;padding:4px 0}
details input[type=range]{width:100%;accent-color:var(--accent);height:28px}
details output{color:var(--accent);font-weight:700}
#cmpHint{display:flex;flex-direction:column;gap:6px}
.pk{background:var(--panel2);border-radius:10px;padding:6px 10px;color:var(--ink)}
.pk b{color:var(--accent)}
.des{background:var(--panel2);border-radius:10px;padding:8px 10px;margin:10px 0 0;font-size:14px}.des b{color:var(--accent)}
.seg{display:flex;gap:6px}.seg button{flex:1}
.camb{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;cursor:pointer;font-weight:600}
.camb:focus-within{outline:2px solid var(--accent);outline-offset:2px}
#camMsg{background:var(--panel);border-inline-start:4px solid var(--accent);border-radius:8px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){.meter .fill{transition:none}}
</style>
</head>
<body>
<main>
<header>
  <h1>جرّب عدستك قبل ما تلبسها</h1>
  <p class="sub">حرّك العدسة على المنظر، وشوف مجال الرؤية مع كل عدسة.</p>
</header>

<div id="wrap">
  <canvas id="cv" aria-label="منظر من خلال العدسة، اسحب لتحريك العدسة"></canvas>
  <div id="fsbar">
    <button id="fsDown">عدسة أقل</button>
    <div id="fsName"></div>
    <button id="fsUp">عدسة أعلى</button>
    <button id="fsExit">خروج</button>
  </div>
  <div id="hint">اسحب العدسة بإصبعك</div>
</div>
<button class="big" id="fsGo">عرض بملء الشاشة</button>
<div class="grid3" style="grid-template-columns:repeat(3,1fr)">
  <label class="camb" for="photo">📷 صوّر المكان<input type="file" id="photo" accept="image/*" capture="environment" hidden></label>
  <button id="live">🎥 كاميرا مباشرة</button>
  <button id="demo">🏙️ المنظر الجاهز</button>
</div>
<p class="sub" id="camMsg" hidden></p>

<section class="card" aria-label="اختيار العدسة">
  <div class="grid3" id="brands"></div>
  <div class="grid3" id="tiers" style="margin-top:8px"></div>
  <div class="seg" style="margin-top:10px">
    <button id="one" aria-pressed="true">عدسة واحدة</button>
    <button id="two" aria-pressed="false">مقارنة بين عدستين</button>
  </div>
  <p class="sub" id="cmpHint" style="margin-top:6px"></p>
</section>

<section class="card">
  <h2 id="iName"></h2>
  <p class="sub" id="iTag"></p>
  <p class="des" id="iDes"></p>
  <div class="meter"><span>اتساع مجال الرؤية</span><div class="track"><div class="fill" id="mField"></div></div></div>
  <div class="meter"><span>سهولة التعوّد</span><div class="track"><div class="fill" id="mAdapt"></div></div></div>
  <ul class="ben" id="iBen"></ul>
</section>

<details>
  <summary>إعدادات البائع</summary>
  <p><label for="sph">المقاس الكروي (سفير):</label> <output id="oSph"></output></p>
  <input type="range" id="sph" min="-10" max="8" step="0.25" value="0">
  <p><label for="cyl">الاستجماتيزم (سلندر):</label> <output id="oCyl"></output></p>
  <input type="range" id="cyl" min="-6" max="0" step="0.25" value="0">
  <p><label for="axis">المحور (أكسيس):</label> <output id="oAxis"></output></p>
  <input type="range" id="axis" min="0" max="180" step="5" value="180">
  <p><label for="add">قوة الإضافة للعميل:</label> <output id="oAdd"></output></p>
  <input type="range" id="add" min="0.25" max="4" step="0.25" value="2">
  <p><label for="des">تصميم العدسة الأولى:</label></p>
  <select id="des" style="width:100%"><option value="-1">تلقائي حسب الفئة</option><option value="0">سفريك</option><option value="1">أسفريك</option><option value="2">دبل أسفريك</option><option value="3">فري فورم</option></select>
  <p id="rxLine" style="color:var(--ink)"></p>
  <p>العرض توضيحي للمقارنة بين العدسات، ومساحات الرؤية مرسومة بشكل مبسّط وليست قياسات رسمية من المصنع.</p>
</details>
</main>

<script>
const BRANDS=[{ar:'أو سي',en:'OC',from:'كوري'},{ar:'كلاريفو',en:'Clarivo',from:'ياباني'},{ar:'بريلمان',en:'Brillmann',from:'ألماني'}];
const B_STD=['رؤية يومية حادة','رؤية مريحة للقريب والمتوسط والبعيد','طبقة مضادة للانعكاس ومقاومة للصدمات'];
const B_PRE=B_STD.concat(['رؤية يومية محسّنة','حماية من الضوء الأزرق']);
const B_ELI=B_PRE.concat(['مجال رؤية أوسع وتشوّهات أقل','عدسة أنحف وأخف','مقاومة عالية للبقع والخدوش وسهلة التنظيف']);
const B_PRS=['رؤية يومية حادة ومحسّنة','مجال رؤية أوسع','انتقالات بصرية سلسة بين المسافات'];
const B_SIG=B_PRS.concat(['إحساس أقل بفقدان التوازن']);
const B_EXC=B_SIG.concat(['تركيز حاد فوري','تكيّف سهل وسريع مع العدسة']);
const B_DIG=['رؤية واضحة للبعيد والمتوسط والقريب','تصميم رقمي للاستخدام اليومي'];
const B_PRM=B_DIG.concat(['مجال أوسع للقراءة والشاشة']);
const B_OPT=B_PRM.concat(['أوسع مجال رؤية في الفئة الكورية']);
const DESIGNS=[
 {ar:'سفريك',en:'Spherical',k:1.6,ic:'🔵',tx:'تصميم تقليدي: الأطراف أتخن، والتشويش على الجناب بيزيد مع المقاسات العالية.'},
 {ar:'أسفريك',en:'Aspheric',k:1.15,ic:'🟢',tx:'سطح محسوب: العدسة أرفع وأخف، والأطراف أوضح من السفريك.'},
 {ar:'دبل أسفريك',en:'Double Aspheric',k:.8,ic:'🟡',tx:'الوشّين محسوبين: وضوح أكتر على الجناب، وعدسة أرفع وأفلت.'},
 {ar:'فري فورم',en:'FreeForm',k:.5,ic:'🟣',tx:'محسوبة رقمياً نقطة بنقطة على مقاسك: أوسع مجال وأقل تشويش حتى مع المقاسات العالية.'}
];
const LENSES=[
 {b:0,ar:'ديجيتال',en:'Digital',d:1,cf:.85,nf:.70,df:.70,gk:.24,field:30,adapt:40,tag:'بداية عملية لعدسة متعددة البؤر.',ben:B_DIG},
 {b:0,ar:'بريميوم',en:'Premium',d:1,cf:.95,nf:.78,df:.80,gk:.22,field:38,adapt:45,tag:'راحة أكثر في القراءة والشاشة.',ben:B_PRM},
 {b:0,ar:'أوبتيما',en:'Optima',d:2,cf:1.05,nf:.86,df:.90,gk:.20,field:46,adapt:50,tag:'أفضل ما في الفئة الكورية.',ben:B_OPT},
 {b:1,ar:'ستاندرد',en:'Standard',d:0,cf:1.0,nf:.80,df:.85,gk:.21,field:42,adapt:45,tag:'عدسة متعددة البؤر تعتمد عليها كل يوم.',ben:B_STD},
 {b:1,ar:'بريمير',en:'Premier',d:0,cf:1.0,nf:.80,df:.85,gk:.21,field:42,adapt:45,tag:'نفس العدسة الموثوقة مع حماية من الضوء الأزرق.',ben:B_PRE},
 {b:1,ar:'إيليت',en:'Elite',d:1,cf:1.2,nf:.98,df:1.0,gk:.18,field:58,adapt:60,tag:'عدسة أرفع وأوضح بمجال رؤية أوسع.',ben:B_ELI},
 {b:2,ar:'بريستيج',en:'Prestige',d:2,cf:1.3,nf:1.05,df:1.1,gk:.17,field:68,adapt:70,tag:'تجربة سلسة ومريحة لحياتك اليومية.',ben:B_PRS},
 {b:2,ar:'سيجنتشر',en:'Signature',d:2,cf:1.5,nf:1.15,df:1.2,gk:.15,field:82,adapt:88,tag:'أداء بصري محسّن مع انتقال سلس بين مناطق الرؤية.',ben:B_SIG},
 {b:2,ar:'إكسلانس',en:'Excellence',d:3,cf:1.75,nf:1.35,df:1.4,gk:.12,field:100,adapt:100,tag:'دقة بصرية متقدمة تتكيف مع نمط حياتك وعاداتك.',ben:B_EXC}
];
const S={dOv:-1,i:7,cmp:-1,add:2,sph:0,cyl:0,axis:180,gx:80,gy:47};
const K=1.7,L=14,M=2.2,NP=3.2,GX=96,GY=54;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ss=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
const full=T=>BRANDS[T.b].ar+' '+T.ar;

/* ---------- simplified zone model ---------- */
const desOf=T=>DESIGNS[(S.dOv>=0&&T===LENSES[S.i])?S.dOv:T.d];
function rxNarrow(T){
  const q=desOf(T).k, ob=Math.abs(Math.sin(2*S.axis*Math.PI/180));
  return 1/(1+q*(.035*Math.abs(S.sph)+.07*Math.abs(S.cyl)*(1+.5*ob)));
}
function halfW(T,y){
  const a=S.add,f=rxNarrow(T);
  return f*halfW0(T,y,a);
}
function halfW0(T,y,a){
  const wC=M*T.cf*L/(4*a), wN=M*T.nf*14/(a+.5), wD=M*T.df*28/(a+.5);
  if(y>=0) return wD+y*(2+T.df*2.5);
  const t=-y/L;
  if(t<.45) return lerp(wD,wC,ss(t/.45));
  if(t<1) return lerp(wC,wN,ss((t-.45)/.55));
  return wN+(t-1)*L*.12;
}

/* ---------- scene ---------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const sharp=mk(1600,900),bMid=mk(800,450),b1=mk(400,225),b2=mk(160,90),tmp=mk(640,360),m1=mk(GX,GY),m2=mk(GX,GY);
const Q=new Float32Array(GX*GY);
function qAt(u,v){
  if(u>44&&u<116&&v>68) return 1;
  if(u>120&&u<135&&v>64) return 1;
  if(u>50&&u<110&&v>33&&v<=68) return .5;
  if(u>10&&u<32&&v>28&&v<58) return .5;
  if(u>135&&u<148&&v>45&&v<58) return .5;
  if(v>57) return .5+.5*ss((v-60)/20);
  return 0;
}
for(let j=0;j<GY;j++)for(let i=0;i<GX;i++)Q[j*GX+i]=qAt((i+.5)/GX*160,(j+.5)/GY*90);

function paintScene(){
  const c=sharp.getContext('2d');c.setTransform(10,0,0,10,0,0);
  let seed=7;const r=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const rect=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  const poly=(pts,col)=>{c.fillStyle=col;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill()};
  const rr=(x,y,w,h,rad,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(x+rad,y);c.arcTo(x+w,y,x+w,y+h,rad);c.arcTo(x+w,y+h,x,y+h,rad);c.arcTo(x,y+h,x,y,rad);c.arcTo(x,y,x+w,y,rad);c.closePath();c.fill()};
  const txt=(s,x,y,h,col,wt,al)=>{c.fillStyle=col;c.font=`${wt||500} ${h}px "IBM Plex Sans Arabic",Tahoma,sans-serif`;c.textAlign=al||'right';c.textBaseline='middle';c.direction='rtl';c.fillText(s,x,y)};
  /* far: sky and city */
  let g=c.createLinearGradient(0,0,0,56);g.addColorStop(0,'#6fadea');g.addColorStop(1,'#eaf3fa');rect(0,0,160,56,g);
  g=c.createRadialGradient(128,9,0,128,9,26);g.addColorStop(0,'rgba(255,250,225,.95)');g.addColorStop(1,'rgba(255,250,225,0)');rect(100,0,60,40,g);
  let x=-2;while(x<162){const w=5+r()*7,h=12+r()*26;rect(x,55-h,w,h,`hsl(214,${14+r()*10}%,${68+r()*12}%)`);x+=w+.4}
  x=-3;while(x<162){const w=6+r()*8,h=16+r()*30;rect(x,55-h,w,h,`hsl(${208+r()*10},${18+r()*14}%,${34+r()*20}%)`);
    c.fillStyle='rgba(235,244,255,.5)';for(let yy=55-h+1.6;yy<53;yy+=2.3)for(let xx=x+1;xx<x+w-1.2;xx+=1.7)if(r()>.3)c.fillRect(xx,yy,.95,1.25);
    x+=w+(r()<.35?1.8:.3)}
  rect(62,17,18,38,'#4a5a78');c.fillStyle='rgba(235,244,255,.5)';for(let yy=20;yy<53;yy+=2.3)for(let xx=63.2;xx<78.5;xx+=1.7)c.fillRect(xx,yy,.95,1.25);
  rect(59,10.5,24,6.5,'#b3322a');txt('فندق النخيل',71,13.9,3.4,'#fff',700,'center');
  /* window frame */
  rect(37,0,1.6,56,'#39415a');rect(121.4,0,1.6,56,'#39415a');rect(0,0,160,1.6,'#39415a');
  rect(0,55,160,2.6,'#efeae2');rect(0,57.6,160,.9,'rgba(0,0,0,.2)');
  /* desk */
  g=c.createLinearGradient(0,58,0,90);g.addColorStop(0,'#c0935f');g.addColorStop(1,'#8d6238');rect(0,58.3,160,32,g);
  c.strokeStyle='rgba(70,40,15,.18)';c.lineWidth=.15;for(let yy=62;yy<90;yy+=5.5){c.beginPath();c.moveTo(0,yy);c.lineTo(160,yy+r());c.stroke()}
  /* plant */
  [[22,36,7,3,-.9],[17,39,7,3,-.3],[27,39,7,3,-2.6],[22,42,8,3.2,-1.6],[15,44,6,2.6,.2],[29,44,6,2.6,2.9],[20,33,6,2.6,-1.3],[25,34,6,2.6,-1.9]].forEach((l,i)=>{
    c.save();c.translate(l[0],l[1]);c.rotate(l[4]);c.fillStyle=i%2?'#3f9a55':'#57b56a';c.beginPath();c.ellipse(0,0,l[2],l[3],0,0,7);c.fill();c.restore()});
  poly([[15,47],[29,47],[27,58.5],[17,58.5]],'#e6ddd0');rect(15,47,14,1.2,'#d3c8b8');
  /* mug */
  rr(137,47,9,11,1.2,'#f5f6f8');c.strokeStyle='#f5f6f8';c.lineWidth=1.3;c.beginPath();c.arc(146.6,52.5,2.6,-1.3,1.3);c.stroke();rect(137,47,9,1,'#d9dce2');
  /* intermediate: laptop */
  rr(54,33,52,29.5,1.4,'#1f232c');rect(55.5,34.5,49,26.3,'#fbfcfe');
  rect(55.5,34.5,49,3.4,'#2d5fa8');txt('ملخص المشروع',103,36.3,2,'#fff',700);
  g=c.createLinearGradient(0,39.5,0,50);g.addColorStop(0,'#8fc0ee');g.addColorStop(1,'#e3effa');rect(58,39.5,17,10.5,g);
  [[59,5],[61.6,8],[64.5,6],[67.4,9],[70.3,4.5],[72.4,7]].forEach(b=>rect(b[0],50-b[1],2.2,b[1],'#4a628a'));
  txt('تقرير الأداء الشهري',103,41,2,'#1c2640',700);
  txt('نسبة الإنجاز: 85%',103,44.3,1.6,'#3a4763');txt('عملاء جدد: 124 عميل',103,47,1.6,'#3a4763');txt('الموعد القادم: الخميس',103,49.7,1.6,'#3a4763');
  [3,4.6,3.8,6,5,7].forEach((h,k)=>rect(58+k*2.9,59.3-h,2,h,'#2d5fa8'));
  [53.2,55.2,57.2,59.2].forEach((yy,k)=>rect(80+k*1.5,yy,23-k*1.5,.55,'#b7c0cf'));
  rect(54,62,52,1,'#2a2e37');poly([[51,63],[109,63],[113,68.3],[47,68.3]],'#cfd4dc');
  for(let rw=0;rw<3;rw++)for(let kx=54+rw*-.8;kx<106+rw*.8;kx+=3)rect(kx,63.6+rw*1.5,2.3,1,'#a9b0bc');
  /* near: book */
  poly([[46,72],[79.6,70],[79.6,92],[42,92]],'#f7f1e3');poly([[80.4,70],[114,72],[118,92],[80.4,92]],'#f7f1e3');
  g=c.createLinearGradient(74,0,86,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,'rgba(60,40,10,.28)');g.addColorStop(1,'rgba(0,0,0,0)');rect(74,70,12,22,g);
  txt('الفصل الثالث',111,75,2.2,'#2a2418',700);
  ['الرؤية الواضحة تبدأ من عدسة','مصممة لتناسب يومك كله،','من القراءة إلى القيادة','ومن الشاشة إلى الطريق.'].forEach((s,k)=>txt(s,111,78.4+k*2.9,1.7,'#3a3428'));
  ['كل مسافة لها منطقة','في العدسة متعددة البؤر،','وكلما اتسعت المنطقة','صارت الحركة أسهل','والتعوّد أسرع.'].forEach((s,k)=>txt(s,76.5,75+k*2.9,1.7,'#3a3428'));
  /* near: phone */
  rr(121,65,13,24,1.5,'#15171c');rect(121.9,66.6,11.2,20.8,'#eef2f7');
  rr(123.6,68.2,8.6,3,.8,'#25c466');txt('السلام عليكم',131.6,69.75,1.25,'#fff',600);
  rr(122.6,72.4,8.6,3,.8,'#ffffff');txt('نظارتك جاهزة',130.6,73.95,1.25,'#222',600);
  rr(123.6,76.6,8.6,3,.8,'#25c466');txt('شكراً لكم',131.6,78.15,1.25,'#fff',600);
  /* blurred copies */
  let k=bMid.getContext('2d');k.imageSmoothingQuality='high';k.drawImage(sharp,0,0,800,450);
  k=b1.getContext('2d');k.imageSmoothingQuality='high';k.drawImage(bMid,0,0,400,225);
  k=b2.getContext('2d');k.imageSmoothingQuality='high';k.drawImage(b1,0,0,160,90);
}

/* ---------- render ---------- */
const wrap=$('wrap'),cv=$('cv'),ctx=cv.getContext('2d');
let cw=0,ch=0,sc=1,ox=0,oy=0,dpr=1,rot=false,nativeFs=false;
const i1=m1.getContext('2d').createImageData(GX,GY),i2=m2.getContext('2d').createImageData(GX,GY);
function computeMasks(){
  const TA=LENSES[S.i],TB=S.cmp>=0?LENSES[S.cmp]:TA,d1=i1.data,d2=i2.data;
  for(let j=0;j<GY;j++){const v=(j+.5)/GY*90,yc=-(v-S.gy)/K,y=yc-3,ey=Math.pow(Math.abs(yc)/18,NP);
    for(let i=0;i<GX;i++){const u=(i+.5)/GX*160,x=(u-S.gx)/K,q=Q[j*GX+i],k=(j*GX+i)*4;let be;
      if(ey+Math.pow(Math.abs(x)/26,NP)<=1){
        const T=x>0?TB:TA,d=Math.abs(x)-halfW(T,y);
        const rxb=1+desOf(T).k*.06*(Math.abs(S.sph)+Math.abs(S.cyl));
        const ba=d>0?clamp(d*S.add*T.gk*rxb/1.5,0,1)*.6:0;
        const bd=SRC==='scene'?clamp((Math.abs(ss(-y/L)-q)-.3)*1.2,0,.8):0;
        be=Math.max(SRC==='scene'?ba:ba*1.4,bd);
      } else be=SRC==='scene'?.3+.5*q:0;
      d1[k+3]=255*clamp(be/.45,0,1);d2[k+3]=255*clamp((be-.45)/.55,0,1);
    }}
  m1.getContext('2d').putImageData(i1,0,0);m2.getContext('2d').putImageData(i2,0,0);
}
function lensPoly(c){
  c.moveTo(S.gx+26*K,S.gy);
  for(let n=1;n<80;n++){const a=n/80*Math.PI*2,cx=Math.cos(a),sy=Math.sin(a);
    c.lineTo(S.gx+26*K*Math.sign(cx)*Math.pow(Math.abs(cx),2/NP),S.gy+18*K*Math.sign(sy)*Math.pow(Math.abs(sy),2/NP))}
  c.closePath();
}
function pill(str,x,y){
  ctx.font='700 3.1px "IBM Plex Sans Arabic",Tahoma,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
  const w=ctx.measureText(str).width+4;ctx.fillStyle='rgba(240,195,106,.95)';ctx.fillRect(x-w/2,y-2.6,w,5.2);ctx.fillStyle='#231a04';ctx.fillText(str,x,y+.1);
}
/* ---------- camera / photo source ---------- */
let SRC='scene',vid=null,stream=null,raf=0;
function blurChain(){
  let k=bMid.getContext('2d');k.imageSmoothingQuality='high';k.drawImage(sharp,0,0,800,450);
  k=b1.getContext('2d');k.imageSmoothingQuality='high';k.drawImage(bMid,0,0,400,225);
  k=b2.getContext('2d');k.imageSmoothingQuality='high';k.drawImage(b1,0,0,160,90);
}
function coverInto(el,w,h){
  const c=sharp.getContext('2d');c.setTransform(1,0,0,1,0,0);
  const s=Math.max(1600/w,900/h);c.drawImage(el,(1600-w*s)/2,(900-h*s)/2,w*s,h*s);blurChain();
}
function msg(t){const m=$('camMsg');m.textContent=t||'';m.hidden=!t}
function stopLive(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function loop(){if(SRC!=='live')return;if(vid.readyState>=2)coverInto(vid,vid.videoWidth,vid.videoHeight);draw();raf=requestAnimationFrame(loop)}
$('live').addEventListener('click',async()=>{
  msg('');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
    vid=document.createElement('video');vid.muted=true;vid.playsInline=true;vid.srcObject=stream;await vid.play();
    SRC='live';loop();
  }catch(e){stopLive();msg('الكاميرا المباشرة مقفولة جوه الصفحة دي. استخدم زرار "صوّر المكان": بيفتح الكاميرا، تصوّر اللي قدامك، والعدسة تشتغل على الصورة.')}
});
$('photo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{stopLive();SRC='photo';coverInto(img,img.naturalWidth,img.naturalHeight);msg('');draw();URL.revokeObjectURL(img.src)};
  img.onerror=()=>msg('الصورة دي مش راضية تفتح، جرّب صورة تانية.');
  img.src=URL.createObjectURL(f);e.target.value='';
});
$('demo').addEventListener('click',()=>{stopLive();SRC='scene';paintScene();msg('');draw()});

function draw(){
  if(!cw) return;
  computeMasks();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  const dw=160*sc,dh=90*sc;
  ctx.drawImage(sharp,ox,oy,dw,dh);
  const t=tmp.getContext('2d');t.imageSmoothingEnabled=true;t.imageSmoothingQuality='high';
  [[b1,m1],[b2,m2]].forEach(([b,m])=>{
    t.globalCompositeOperation='source-over';t.clearRect(0,0,640,360);t.drawImage(b,0,0,640,360);
    t.globalCompositeOperation='destination-in';t.drawImage(m,0,0,640,360);
    ctx.drawImage(tmp,ox,oy,dw,dh);
  });
  ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
  ctx.beginPath();ctx.rect(-20,-20,200,130);lensPoly(ctx);ctx.fillStyle='rgba(8,12,30,.26)';ctx.fill('evenodd');
  if(S.cmp>=0){
    ctx.save();ctx.beginPath();lensPoly(ctx);ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=.45;ctx.beginPath();ctx.moveTo(S.gx,S.gy-40);ctx.lineTo(S.gx,S.gy+40);ctx.stroke();
    pill(LENSES[S.i].ar,S.gx-20,S.gy-18*K+7);pill(LENSES[S.cmp].ar,S.gx+20,S.gy-18*K+7);
    ctx.restore();
  }
  ctx.beginPath();lensPoly(ctx);ctx.lineWidth=2.4;ctx.strokeStyle='#12151d';ctx.stroke();
  ctx.lineWidth=.45;ctx.strokeStyle='rgba(255,255,255,.4)';ctx.stroke();
  ctx.restore();
}
function layout(){
  const fs=document.body.classList.contains('fs'),st=wrap.style;
  if(fs){const iw=window.innerWidth,ih=window.innerHeight;rot=ih>iw;
    if(rot){st.width=ih+'px';st.height=iw+'px';st.left='50%';st.top='50%';st.transform='translate(-50%,-50%) rotate(90deg)'}
    else{st.width=iw+'px';st.height=ih+'px';st.left='0';st.top='0';st.transform='none'}
  } else {rot=false;st.width=st.height=st.left=st.top=st.transform=''}
  cw=wrap.clientWidth;ch=wrap.clientHeight;if(!cw)return;
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  sc=Math.max(cw/160,ch/90);ox=(cw-160*sc)/2;oy=(ch-90*sc)*.65;
  draw();
}

/* ---------- UI ---------- */
function render(){
  const T=LENSES[S.i];
  if(S.vb<0)S.vb=T.b;
  document.querySelectorAll('#brands button').forEach((b,i)=>b.setAttribute('aria-pressed',i===S.vb));
  $('tiers').innerHTML=LENSES.map((t,i)=>t.b===S.vb?`<button data-i="${i}" aria-pressed="${i===S.i||i===S.cmp}">${t.ar}<small>${t.en}</small></button>`:'').join('');
  $('one').setAttribute('aria-pressed',!S.cmpOn);$('two').setAttribute('aria-pressed',S.cmpOn);
  $('cmpHint').innerHTML=!S.cmpOn?'':'<span class="pk">⬅️ الشمال: <b>'+full(T)+'</b></span><span class="pk">➡️ اليمين: <b>'+(S.cmp<0?'اختار من أي ماركة':full(LENSES[S.cmp]))+'</b></span>';
  const DS=desOf(T);$('iDes').innerHTML='<b>'+DS.ic+' التصميم: '+DS.ar+'</b><br>'+DS.tx;
  $('des').value=S.dOv;
  $('iName').textContent=full(T);$('iTag').textContent='صناعة '+BRANDS[T.b].from+'. '+T.tag;
  $('mField').style.width=T.field+'%';$('mAdapt').style.width=T.adapt+'%';
  $('iBen').innerHTML=T.ben.map(b=>`<li>${b}</li>`).join('');
  $('fsName').textContent=full(T)+' · '+desOf(T).ar;
  const sg=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2);
  $('oAdd').textContent='+'+S.add.toFixed(2);$('oSph').textContent=sg(S.sph);$('oCyl').textContent=sg(S.cyl);$('oAxis').textContent=S.axis+'°';
  $('rxLine').textContent='المقاس: '+sg(S.sph)+' / '+sg(S.cyl)+' × '+S.axis+'° · إضافة +'+S.add.toFixed(2);
  draw();
}
S.cmpOn=false;S.vb=-1;
function pick(i){S.dOv=-1;S.i=clamp(i,0,LENSES.length-1);if(S.cmp===S.i)S.cmp=-1;S.vb=LENSES[S.i].b;render()}
function tap(i){S.dOv=-1;
  if(!S.cmpOn){S.i=i;S.cmp=-1;render();return}
  if(i===S.cmp){S.cmp=-1}
  else if(i===S.i){if(S.cmp>=0){S.i=S.cmp;S.cmp=-1}}
  else if(S.cmp<0){S.cmp=i}
  else {S.i=S.cmp;S.cmp=i}
  render();
}
$('brands').innerHTML=BRANDS.map((b,i)=>`<button data-b="${i}">${b.ar}<small>${b.en} · ${b.from}</small></button>`).join('');
$('brands').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=+b.dataset.b;S.vb=k;
  if(!S.cmpOn&&LENSES[S.i].b!==k){S.i=LENSES.findIndex(t=>t.b===k)+2}render()});
$('tiers').addEventListener('click',e=>{const b=e.target.closest('button');if(b)tap(+b.dataset.i)});
$('one').addEventListener('click',()=>{S.cmpOn=false;S.cmp=-1;render()});
$('two').addEventListener('click',()=>{S.cmpOn=true;render()});
$('add').addEventListener('input',e=>{S.add=+e.target.value;render()});
$('des').addEventListener('change',e=>{S.dOv=+e.target.value;render()});
['sph','cyl','axis'].forEach(k=>$(k).addEventListener('input',e=>{S[k]=+e.target.value;render()}));
$('fsUp').addEventListener('click',()=>pick(S.i+1));
$('fsDown').addEventListener('click',()=>pick(S.i-1));
function enterFs(){
  document.body.classList.add('fs');layout();
  try{const el=document.documentElement,p=el.requestFullscreen&&el.requestFullscreen();
    if(p&&p.then)p.then(()=>{try{const o=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(o&&o.catch)o.catch(()=>{})}catch(_){}}).catch(()=>{})}catch(_){}
}
function exitFs(){
  document.body.classList.remove('fs');
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(_){}
  layout();
}
$('fsGo').addEventListener('click',enterFs);
$('fsExit').addEventListener('click',exitFs);
document.addEventListener('fullscreenchange',()=>{
  if(document.fullscreenElement)nativeFs=true;
  else if(nativeFs){nativeFs=false;document.body.classList.remove('fs')}
  layout();
});
let drag=null;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];$('hint').style.display='none';try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  let dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=[e.clientX,e.clientY];
  if(rot){const t=dx;dx=dy;dy=-t}
  S.gx=clamp(S.gx+dx/sc,25,135);S.gy=clamp(S.gy+dy/sc,20,72);draw();
});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null}));
window.addEventListener('keydown',e=>{
  const m={ArrowLeft:[-3,0],ArrowRight:[3,0],ArrowUp:[0,-3],ArrowDown:[0,3]}[e.key];
  if(m&&(document.body.classList.contains('fs')||document.activeElement===document.body)){e.preventDefault();S.gx=clamp(S.gx+m[0],25,135);S.gy=clamp(S.gy+m[1],20,72);draw()}
  if(e.key==='Escape'&&document.body.classList.contains('fs'))exitFs();
});
window.addEventListener('resize',layout);
paintScene();render();layout();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{paintScene();draw()});
</script>
</body>
