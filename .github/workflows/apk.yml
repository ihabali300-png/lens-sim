name: Build APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - name: Build
        env: { VCODE: '${{ github.run_number }}' }
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk IHAB-Vision-Lab.apk
      - uses: actions/upload-artifact@v4
        with: { name: IHAB-Vision-Lab, path: IHAB-Vision-Lab.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: IHAB Vision Lab ${{ github.run_number }}
          make_latest: true
          files: IHAB-Vision-Lab.apk
