plugins { id 'com.android.application' }
android {
    namespace 'com.ihab.visionlab'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ihab.visionlab'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VCODE') ?: '1')
        versionName "1." + (System.getenv('VCODE') ?: '1')
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'owner'
    productFlavors {
        pro {
            dimension 'owner'
            resValue 'string', 'app_name', 'IHAB Vision Lab Pro'
            buildConfigField 'String', 'START_URL', '"https://ihabali300-png.github.io/lens-sim/?ed=pro"'
        }
        friend {
            dimension 'owner'
            applicationIdSuffix '.friend'
            resValue 'string', 'app_name', 'IHAB Vision Lab'
            buildConfigField 'String', 'START_URL', '"https://ihabali300-png.github.io/lens-sim/?ed=friend"'
        }
    }
    signingConfigs {
        release {
            storeFile file('ihab-vision-lab.jks')
            storePassword 'ihabvisionlab'
            keyAlias 'ihab'
            keyPassword 'ihabvisionlab'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.10.0' }
